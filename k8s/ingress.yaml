apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: virtual-board-ingress
  labels:
    app: virtual-board
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: virtual-board.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: virtual-board-service
                port:
                  number: 80
