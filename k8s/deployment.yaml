apiVersion: apps/v1
kind: Deployment
metadata:
  name: virtual-board-deployment
  labels:
    app: virtual-board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: virtual-board
  template:
    metadata:
      labels:
        app: virtual-board
    spec:
      containers:
        - name: virtual-board
          image: roshanyd/virtual-board:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: virtual-board-config
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
